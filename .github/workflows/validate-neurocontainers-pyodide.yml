name: Validate NeuroContainers With Pyodide

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-neurocontainers:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout neurocontainers-ui
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Clone NeuroContainers
        run: git clone --depth 1 --branch main https://github.com/neurodesk/neurocontainers.git /tmp/neurocontainers

      - name: Validate all NeuroContainers recipes in Pyodide
        run: npm run validate:neurocontainers:pyodide -- --repo /tmp/neurocontainers
